name: tests

# Separate from `canary.yml`: that workflow spends money on real microVMs and
# runs on a clock, this one is the cheap gate that has to pass on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 for native TypeScript type stripping — `node --test "test/*.test.ts"`
          # runs the sources directly, with no build step to go stale.
          node-version: 24
          cache: npm

      # No @solarisdk peers here on purpose. They are optional, and the suite is
      # meant to prove it: every test drives the adapter through an injected
      # loader, so a missing peer must not be able to turn the run green by
      # skipping anything.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test
